<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {{{styleSheetUris}}}

    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(148, 163, 184, 0.35);
            --panel-shadow: rgba(15, 23, 42, 0.12);
            --text-color: #1f2937;
            --muted-color: #4b5563;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-text: #ffffff;
            --checkbox-bg: #ffffff;
            --checkbox-border: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #f3f4f6;
            color: var(--text-color);
        }

        body.vscode-dark {
            background: #1f1f1f;
            color: #e5e7eb;
            --panel-bg: rgba(31, 41, 55, 0.92);
            --panel-border: rgba(148, 163, 184, 0.22);
            --panel-shadow: rgba(0, 0, 0, 0.32);
            --text-color: #e5e7eb;
            --muted-color: #cbd5e1;
            --primary-color: #60a5fa;
            --primary-hover: #3b82f6;
            --primary-text: #0f172a;
            --checkbox-bg: #111827;
            --checkbox-border: #64748b;
        }

        #optionForm {
            width: min(620px, calc(100% - 32px));
            margin: 0px auto 16px;
            padding: 20px 22px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            background: var(--panel-bg);
            box-shadow: 0 12px 28px var(--panel-shadow);
            backdrop-filter: blur(6px);
            box-sizing: border-box;
        }

        .export-title {
            display: block;
            margin: 0 0 16px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-color);
            text-align: center;
        }

        .export-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .export-option {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            color: var(--muted-color);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .export-option:hover {
            background-color: rgba(148, 163, 184, 0.08);
        }

        .export-option input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            margin: 0;
            border: 2px solid var(--checkbox-border);
            border-radius: 5px;
            background: var(--checkbox-bg);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-option input[type="checkbox"]:checked {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .export-option input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .export-button {
            display: block;
            margin: 0 auto;
            min-width: 160px;
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--primary-text);
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .export-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.32);
        }

        .export-button:active {
            transform: translateY(0);
        }

        .export-button:focus-visible,
        .export-option input[type="checkbox"]:focus-visible {
            outline: 2px solid rgba(96, 165, 250, 0.8);
            outline-offset: 2px;
        }

        hr {
            margin: 0 0 12px;
            border: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.35);
        }
    </style>
    <title>{{title}}</title>
</head>
<body>
    <form id="optionForm" aria-label="{{labels.exportOptionsLabel}}">
        <label class="export-title">{{labels.exportOptionsLabel}}</label>

        <div class="export-row">
            <label class="export-option">
                <input type="checkbox" name="generateFileList" checked />
                <span>{{labels.generateFileListLabel}}</span>
            </label>
        </div>

        <button type="submit" class="export-button">{{labels.exportButtonLabel}}</button>
    </form>

    <hr>

    <h2 class="is-size-3 m-2">{{header}}</h2>
    <h4 class="m-2">{{lineCountContent}}</h4>
    <div id="diffOutput" class="m-2">
        {{{htmlContent}}}
    </div>

    {{{scriptUris}}}}

</body>
</html>
