name: Bug report
description: Something in the extension does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste proprietary source code —
        a minimal reproduction or a synthetic diff is enough.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem, including the exact error message if any.
      placeholder: I selected `main` as base and `feature/x` as current, clicked Export HTML, and the file was empty.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repo with ...
        2. Run Generate Diff Report
        3. Select ...
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command
      options:
        - Generate Diff Report
        - Generate Change Item Report
        - Both
        - Installation / activation
    validations:
      required: true

  - type: input
    id: ext-version
    attributes:
      label: Extension version
      placeholder: 1.2.3
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help → About
      placeholder: 1.95.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: language-ext
    attributes:
      label: Language extension (only for symbol-level issues)
      description: Which extension provides document symbols for the affected files?
      placeholder: ms-vscode.cpptools
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: |
        Open **View → Output** and select the `diff2html-report` channel, then copy the log into this field.
        For deeper diagnostics, open **Help → Toggle Developer Tools** (or run `Developer: Toggle Developer Tools`
        from the Command Palette) and copy any errors from the Console tab.
        Screenshots of the preview are welcome.
      render: shell
    validations:
      required: false