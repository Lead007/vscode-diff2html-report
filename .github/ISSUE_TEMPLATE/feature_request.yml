name: Feature request
description: Suggest a workflow, an export format, or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful feature requests describe the workflow, not the implementation.
        "I need to attach a change summary to a Jira ticket" beats "add a PDF button".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task, and where the extension currently gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine the extension could support this. Mockups are welcome.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, links, or examples from other tools that do this well.
    validations:
      required: false
